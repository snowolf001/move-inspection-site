<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terms of Use | LORAN</title><meta name="description" content="LORAN Terms of Use and subscription terms."><meta name="theme-color" content="#08142b"><link rel="canonical" href="https://cleanutilityapps.com/loran/terms/"><link rel="icon" href="/assets/images/loran/loran.png"><link rel="stylesheet" href="/assets/css/site.css"><style>body{background:#08142b;color:#e2e8f0;font-family:system-ui,sans-serif;margin:0}.page{max-width:760px;margin:auto;padding:24px 16px 60px}.card{background:#111e34;border:1px solid #34435a;border-radius:16px;padding:20px;margin:14px 0}h1{font-size:30px}h2{font-size:19px;margin:0 0 10px}p{color:#bac5d6;line-height:1.7}a{color:#93c5fd}select{background:#17233b;color:white;padding:10px;border:1px solid #64748b;border-radius:8px}.meta{font-size:13px;color:#a3aec0}.links{display:flex;gap:18px;flex-wrap:wrap}</style></head><body><main class="page"><p><a id="back" href="/loran/">← LORAN</a></p><section class="card"><label for="language">Language / 语言</label><p><select id="language" aria-label="Terms language"><option value="en">English</option><option value="zh">中文</option><option value="es">Español</option><option value="pt">Português</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="vi">Tiếng Việt</option><option value="id">Bahasa Indonesia</option></select></p><p class="meta" id="note">Translations are provided for convenience. Refer to the English version if wording differs.</p></section><section class="card"><img src="/assets/images/loran/loran.png" alt="" width="48" height="48" style="border-radius:12px"><h1 id="title"></h1><p>LORAN · Clean Utility Apps</p><p class="meta" id="date"></p></section><div id="sections"></div><section class="card links"><a id="privacy" href="/loran/privacy/">Privacy Policy</a><a href="mailto:cleanutilityapps@gmail.com">cleanutilityapps@gmail.com</a></section></main><script>const translations={"en":["Terms of Use","Effective October 26, 2026","About LORAN","LORAN provides English and Chinese speaking practice, including AI-assisted conversations, pronunciation, daily expressions, and picture exercises. Learning results and AI responses may be inaccurate and are not guaranteed.","Subscriptions","Optional LORAN Pro subscriptions may be offered monthly or yearly. Prices, billing periods, and any trial are shown in the app store before purchase. Subscriptions automatically renew unless canceled at least 24 hours before the current period ends, subject to store rules. The store handles payment, renewal, cancellation, and refunds. Manage or cancel your subscription in Apple App Store or Google Play settings. Deleting the app does not cancel a subscription.","Acceptable use","Use LORAN lawfully. Do not misuse the service, attempt unauthorized access, interfere with its operation, or submit content that infringes others' rights.","AI and availability","AI-generated lessons, transcriptions, pronunciation feedback, and conversations may contain errors. LORAN is provided for language practice, not professional advice. Features, usage limits, and availability may change. Internet access and microphone permission may be required.","Privacy","Please read our Privacy Policy for information about audio processing, service providers, and other data practices.","Liability","To the extent permitted by applicable law, LORAN is provided as available without warranties. Clean Utility Apps is not responsible for indirect or consequential losses. Nothing in these terms limits rights that cannot legally be excluded.","Changes and contact","We may update these terms and their effective date. Questions: cleanutilityapps@gmail.com."],"zh":["使用条款","生效日期：2026 年 10 月 26 日","关于 LORAN","LORAN 提供英语和中文口语练习，包括 AI 对话、发音练习、每日表达和看图练习。学习结果及 AI 回复可能存在错误，不作准确性保证。","订阅","LORAN Pro 可提供按月或按年订阅。购买前，应用商店会显示价格、计费周期及适用的试用信息。除非根据商店规则在当前周期结束至少 24 小时前取消，否则订阅将自动续订。付款、续订、取消及退款由应用商店处理。请在 Apple App Store 或 Google Play 设置中管理或取消订阅。卸载应用不会取消订阅。","使用规则","请合法使用 LORAN。不得滥用服务、尝试未经授权的访问、干扰服务运行或提交侵犯他人权利的内容。","AI 与服务可用性","AI 生成的课程、语音转写、发音反馈及对话可能出错。LORAN 仅用于语言练习，不提供专业建议。功能、使用限额和可用性可能调整。部分功能需要网络连接和麦克风权限。","隐私","请阅读隐私政策，了解音频处理、第三方服务商和其他数据处理方式。","责任限制","在适用法律允许的范围内，LORAN 按现状提供，不作保证。Clean Utility Apps 不对间接或后果性损失承担责任。本条款不限制依法不可排除的权利。","变更与联系","我们可能更新条款及生效日期。如有疑问，请联系 cleanutilityapps@gmail.com。"],"es":["Términos de uso","Vigente desde el 26 de octubre de 2026","Acerca de LORAN","LORAN ofrece práctica oral en inglés y chino mediante conversaciones con IA, pronunciación, expresiones diarias e imágenes. Los resultados y respuestas de IA pueden contener errores.","Suscripciones","LORAN Pro puede ofrecer suscripciones mensuales o anuales. La tienda muestra el precio, el período y cualquier prueba antes de comprar. Se renuevan automáticamente salvo cancelación al menos 24 horas antes del final del período, según las reglas de la tienda. La tienda gestiona pagos, renovaciones, cancelaciones y reembolsos. Administra o cancela en App Store o Google Play. Desinstalar la app no cancela la suscripción.","Uso permitido","Usa LORAN legalmente. No abuses del servicio, accedas sin autorización, interfieras con su funcionamiento ni infrinjas derechos ajenos.","IA y disponibilidad","Las lecciones, transcripciones y respuestas de IA pueden ser incorrectas. LORAN sirve para practicar idiomas, no para recibir asesoramiento profesional. Las funciones y límites pueden cambiar; algunas requieren internet y micrófono.","Privacidad","Consulta nuestra Política de privacidad sobre el tratamiento del audio y los datos.","Responsabilidad","En la medida permitida por la ley, LORAN se ofrece según disponibilidad y sin garantías. No respondemos por pérdidas indirectas. Se mantienen los derechos irrenunciables.","Cambios y contacto","Podemos actualizar estos términos. Consultas: cleanutilityapps@gmail.com."],"pt":["Termos de Uso","Vigente desde 26 de outubro de 2026","Sobre o LORAN","O LORAN oferece prática oral de inglês e chinês com conversas por IA, pronúncia, expressões diárias e imagens. Os resultados e as respostas de IA podem conter erros.","Assinaturas","O LORAN Pro pode oferecer assinaturas mensais ou anuais. A loja informa preços, períodos e eventuais testes antes da compra. A renovação é automática, salvo cancelamento pelo menos 24 horas antes do fim do período, conforme as regras da loja. A loja gerencia pagamentos, renovações, cancelamentos e reembolsos. Gerencie ou cancele na App Store ou no Google Play. Desinstalar o aplicativo não cancela a assinatura.","Uso permitido","Use o LORAN legalmente. Não abuse do serviço, tente acesso não autorizado, prejudique seu funcionamento nem viole direitos de terceiros.","IA e disponibilidade","Lições, transcrições e respostas de IA podem conter erros. O LORAN destina-se ao aprendizado de idiomas, não a aconselhamento profissional. Recursos e limites podem mudar; alguns exigem internet e microfone.","Privacidade","Leia nossa Política de Privacidade sobre áudio e tratamento de dados.","Responsabilidade","Na medida permitida por lei, o LORAN é fornecido conforme disponível, sem garantias. Não respondemos por perdas indiretas. Direitos legais irrenunciáveis permanecem protegidos.","Alterações e contato","Podemos atualizar estes termos. Contato: cleanutilityapps@gmail.com."],"ja":["利用規約","施行日：2026年10月26日","LORANについて","LORANは、AI会話、発音、日常表現、画像を使った英語・中国語のスピーキング練習を提供します。学習結果やAIの回答には誤りが含まれる場合があります。","サブスクリプション","LORAN Proには月額または年額プランがあります。購入前に価格、請求期間、試用条件がストアに表示されます。ストアの規則に従い、期間終了の少なくとも24時間前までに解約しない限り自動更新されます。支払い、更新、解約、返金はストアが管理します。App StoreまたはGoogle Playの設定で管理・解約してください。アプリを削除しても解約されません。","利用上のルール","適法に利用してください。不正アクセス、サービスの妨害、権利侵害、その他の不正利用は禁止します。","AIとサービスの提供","AIによる教材、文字起こし、発音評価、会話には誤りがあり得ます。LORANは語学練習用であり、専門的な助言ではありません。機能や利用制限は変更される場合があります。一部機能には通信とマイクの許可が必要です。","プライバシー","音声やデータの取り扱いについてはプライバシーポリシーをご覧ください。","責任の制限","適用法令で認められる範囲で、LORANは現状有姿で提供され、保証はありません。間接損害について責任を負いません。法令上排除できない権利は制限されません。","変更とお問い合わせ","本規約を更新する場合があります。お問い合わせ：cleanutilityapps@gmail.com。"],"ko":["이용약관","시행일: 2026년 10월 26일","LORAN 소개","LORAN은 AI 대화, 발음, 일상 표현 및 그림을 활용한 영어·중국어 말하기 연습을 제공합니다. 학습 결과와 AI 답변에는 오류가 있을 수 있습니다.","구독","LORAN Pro는 월간 또는 연간 구독을 제공할 수 있습니다. 구매 전에 스토어에서 가격, 결제 기간 및 체험 조건을 확인할 수 있습니다. 스토어 규정에 따라 기간 종료 최소 24시간 전에 취소하지 않으면 자동 갱신됩니다. 결제, 갱신, 취소 및 환불은 스토어에서 처리합니다. App Store 또는 Google Play 설정에서 관리하거나 취소하세요. 앱을 삭제해도 구독은 취소되지 않습니다.","이용 규칙","합법적으로 이용하세요. 무단 접근, 서비스 방해, 타인의 권리 침해 및 서비스 오용은 금지됩니다.","AI 및 서비스","AI 수업, 음성 인식, 발음 피드백 및 대화에는 오류가 있을 수 있습니다. LORAN은 언어 연습용이며 전문적인 조언이 아닙니다. 기능과 사용 한도는 변경될 수 있으며 일부 기능에는 인터넷과 마이크 권한이 필요합니다.","개인정보","음성 및 데이터 처리에 관한 자세한 내용은 개인정보 처리방침을 확인하세요.","책임 제한","관련 법률이 허용하는 범위에서 LORAN은 보증 없이 제공됩니다. 간접 손해에 대한 책임은 지지 않습니다. 법적으로 배제할 수 없는 권리는 유지됩니다.","변경 및 문의","약관은 변경될 수 있습니다. 문의: cleanutilityapps@gmail.com."],"de":["Nutzungsbedingungen","Gültig ab 26. Oktober 2026","Über LORAN","LORAN bietet Sprechübungen für Englisch und Chinesisch mit KI-Gesprächen, Aussprache, täglichen Ausdrücken und Bildern. KI-Antworten und Lernergebnisse können Fehler enthalten.","Abonnements","LORAN Pro kann Monats- und Jahresabos anbieten. Preis, Laufzeit und etwaige Testphasen werden vor dem Kauf im Store angezeigt. Das Abo verlängert sich automatisch, sofern es nicht gemäß den Store-Regeln mindestens 24 Stunden vor Ablauf gekündigt wird. Zahlung, Verlängerung, Kündigung und Erstattung erfolgen über den Store. Verwaltung und Kündigung sind in App Store oder Google Play möglich. Das Löschen der App kündigt das Abo nicht.","Zulässige Nutzung","Nutzen Sie LORAN rechtmäßig. Missbrauch, unbefugter Zugriff, Störungen und die Verletzung fremder Rechte sind untersagt.","KI und Verfügbarkeit","KI-Lektionen, Transkriptionen und Rückmeldungen können fehlerhaft sein. LORAN dient dem Sprachenlernen, nicht der professionellen Beratung. Funktionen und Limits können sich ändern. Einige Funktionen benötigen Internet und Mikrofonzugriff.","Datenschutz","Bitte lesen Sie unsere Datenschutzerklärung zur Audio- und Datenverarbeitung.","Haftung","Soweit gesetzlich zulässig, wird LORAN ohne Gewähr bereitgestellt. Für mittelbare Schäden wird nicht gehaftet. Zwingende gesetzliche Rechte bleiben unberührt.","Änderungen und Kontakt","Diese Bedingungen können aktualisiert werden. Kontakt: cleanutilityapps@gmail.com."],"fr":["Conditions d’utilisation","En vigueur le 26 octobre 2026","À propos de LORAN","LORAN propose des exercices oraux en anglais et en chinois : conversations avec IA, prononciation, expressions quotidiennes et images. Les résultats et réponses de l’IA peuvent comporter des erreurs.","Abonnements","LORAN Pro peut proposer des abonnements mensuels ou annuels. Le prix, la durée et les éventuels essais sont affichés par la boutique avant l’achat. Le renouvellement est automatique sauf résiliation au moins 24 heures avant la fin de la période, selon les règles de la boutique. Paiements, renouvellements, résiliations et remboursements sont gérés par la boutique. Gérez ou résiliez dans l’App Store ou Google Play. Désinstaller l’application ne résilie pas l’abonnement.","Utilisation autorisée","Utilisez LORAN légalement. Tout abus, accès non autorisé, perturbation du service ou atteinte aux droits d’autrui est interdit.","IA et disponibilité","Les leçons, transcriptions et réponses de l’IA peuvent être erronées. LORAN sert à pratiquer les langues et ne fournit pas de conseils professionnels. Les fonctionnalités et limites peuvent changer; certaines nécessitent Internet et le microphone.","Confidentialité","Consultez notre Politique de confidentialité pour le traitement des données et de l’audio.","Responsabilité","Dans les limites de la loi, LORAN est fourni sans garantie. Nous déclinons toute responsabilité pour les pertes indirectes. Les droits impératifs restent applicables.","Modifications et contact","Ces conditions peuvent être mises à jour. Contact : cleanutilityapps@gmail.com."],"it":["Termini di utilizzo","In vigore dal 26 ottobre 2026","Informazioni su LORAN","LORAN offre esercizi di conversazione in inglese e cinese con dialoghi AI, pronuncia, espressioni quotidiane e immagini. I risultati e le risposte AI possono contenere errori.","Abbonamenti","LORAN Pro può offrire abbonamenti mensili o annuali. Prezzi, periodi e prove eventuali sono mostrati dallo store prima dell’acquisto. Il rinnovo è automatico salvo disdetta almeno 24 ore prima della fine del periodo, secondo le regole dello store. Pagamenti, rinnovi, cancellazioni e rimborsi sono gestiti dallo store. Gestisci o annulla in App Store o Google Play. Disinstallare l’app non annulla l’abbonamento.","Uso consentito","Usa LORAN legalmente. Sono vietati abusi, accessi non autorizzati, interferenze con il servizio e violazioni dei diritti altrui.","AI e disponibilità","Lezioni, trascrizioni e risposte AI possono essere inesatte. LORAN è per la pratica linguistica, non per consulenza professionale. Funzioni e limiti possono cambiare; alcune richiedono Internet e microfono.","Privacy","Leggi l’Informativa sulla privacy per informazioni su audio e dati.","Responsabilità","Nei limiti di legge, LORAN è fornito senza garanzie. Non rispondiamo di danni indiretti. Restano salvi i diritti inderogabili.","Modifiche e contatti","Possiamo aggiornare questi termini. Contatto: cleanutilityapps@gmail.com."],"vi":["Điều khoản sử dụng","Có hiệu lực từ ngày 26 tháng 10 năm 2026","Giới thiệu LORAN","LORAN cung cấp luyện nói tiếng Anh và tiếng Trung qua hội thoại AI, phát âm, mẫu câu hằng ngày và hình ảnh. Kết quả học tập và phản hồi AI có thể có sai sót.","Đăng ký","LORAN Pro có thể cung cấp gói tháng hoặc năm. Giá, chu kỳ và thời gian dùng thử (nếu có) được hiển thị trước khi mua. Gói tự động gia hạn trừ khi hủy ít nhất 24 giờ trước khi kết thúc kỳ hiện tại theo quy định của cửa hàng. Cửa hàng xử lý thanh toán, gia hạn, hủy và hoàn tiền. Quản lý hoặc hủy trong App Store hoặc Google Play. Gỡ ứng dụng không hủy đăng ký.","Quy tắc sử dụng","Hãy sử dụng LORAN hợp pháp. Không lạm dụng, truy cập trái phép, gây gián đoạn dịch vụ hoặc xâm phạm quyền của người khác.","AI và khả năng cung cấp","Bài học, bản chép lời và phản hồi AI có thể sai. LORAN phục vụ luyện ngôn ngữ, không phải tư vấn chuyên môn. Tính năng và giới hạn có thể thay đổi; một số cần Internet và quyền micro.","Quyền riêng tư","Vui lòng đọc Chính sách quyền riêng tư về xử lý âm thanh và dữ liệu.","Giới hạn trách nhiệm","Trong phạm vi pháp luật cho phép, LORAN được cung cấp không kèm bảo đảm. Chúng tôi không chịu trách nhiệm về thiệt hại gián tiếp. Các quyền bắt buộc theo luật vẫn được bảo vệ.","Thay đổi và liên hệ","Điều khoản có thể được cập nhật. Liên hệ: cleanutilityapps@gmail.com."],"id":["Ketentuan Penggunaan","Berlaku 26 Oktober 2026","Tentang LORAN","LORAN menyediakan latihan berbicara bahasa Inggris dan Mandarin melalui percakapan AI, pelafalan, ungkapan harian, dan gambar. Hasil belajar dan respons AI dapat mengandung kesalahan.","Langganan","LORAN Pro dapat menawarkan langganan bulanan atau tahunan. Harga, periode, dan uji coba (jika ada) ditampilkan toko sebelum pembelian. Langganan diperpanjang otomatis kecuali dibatalkan setidaknya 24 jam sebelum periode berakhir sesuai aturan toko. Pembayaran, perpanjangan, pembatalan, dan pengembalian dana ditangani toko. Kelola atau batalkan di App Store atau Google Play. Menghapus aplikasi tidak membatalkan langganan.","Penggunaan yang diizinkan","Gunakan LORAN secara sah. Dilarang menyalahgunakan layanan, mengakses tanpa izin, mengganggu operasi, atau melanggar hak pihak lain.","AI dan ketersediaan","Pelajaran, transkripsi, dan tanggapan AI dapat keliru. LORAN untuk latihan bahasa, bukan nasihat profesional. Fitur dan batas penggunaan dapat berubah; beberapa memerlukan internet dan mikrofon.","Privasi","Baca Kebijakan Privasi kami tentang pemrosesan audio dan data.","Batasan tanggung jawab","Sejauh diizinkan hukum, LORAN disediakan tanpa jaminan. Kami tidak bertanggung jawab atas kerugian tidak langsung. Hak yang wajib dilindungi hukum tetap berlaku.","Perubahan dan kontak","Ketentuan ini dapat diperbarui. Kontak: cleanutilityapps@gmail.com."]};const supported=Object.keys(translations);const normalize=s=>(s||'').toLowerCase().replace('_','-').split('-')[0];const params=new URLSearchParams(location.search);const requested=normalize(params.get('lang'));const preferred=(navigator.languages||[navigator.language]).map(normalize).find(l=>supported.includes(l));const select=document.getElementById('language');function render(lang){const t=translations[lang]||translations.en;document.documentElement.lang=lang;document.title=t[0]+' | LORAN';document.getElementById('title').textContent=t[0];document.getElementById('date').textContent=t[1];const holder=document.getElementById('sections');holder.replaceChildren();for(let i=2;i<t.length;i+=2){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=t[i];const p=document.createElement('p');p.textContent=t[i+1];card.append(h,p);holder.append(card)}document.getElementById('privacy').href='/loran/privacy/?lang='+encodeURIComponent(lang);document.getElementById('back').href='/loran/?lang='+encodeURIComponent(lang);const url=new URL(location.href);if(lang==='en')url.searchParams.delete('lang');else url.searchParams.set('lang',lang);history.replaceState(null,'',url);select.value=lang}select.addEventListener('change',()=>render(select.value));render(supported.includes(requested)?requested:(preferred||'en'));</script><script defer src="/_vercel/insights/script.js"></script><script src="/assets/js/site-tracking.js"></script></body></html>
